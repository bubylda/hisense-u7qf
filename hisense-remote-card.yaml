---
type: vertical-stack
cards:
- type: vertical-stack
  title: Пульт
  cards:
  - type: media-control
    entity: media_player.spalnia_hisense_vidaa_tv
  - type: grid
    columns: 2
    square: false
    cards:
    - type: button
      entity: remote.spalnia_hisense_vidaa_tv_remote
      show_state: false
      name: Включить
      icon: mdi:power
      tap_action:
        action: perform-action
        perform_action: remote.turn_on
        target:
          entity_id: remote.spalnia_hisense_vidaa_tv_remote
      hold_action:
        action: none
    - type: button
      entity: remote.spalnia_hisense_vidaa_tv_remote
      show_state: false
      name: Выключить
      icon: mdi:power-standby
      tap_action:
        action: perform-action
        perform_action: remote.turn_off
        target:
          entity_id: remote.spalnia_hisense_vidaa_tv_remote
      hold_action:
        action: none
  - type: grid
    columns: 2
    square: false
    cards:
    - type: button
      name: Выключить экран
      icon: mdi:television-off
      entity: button.spalnia_hisense_vidaa_tv_turn_screen_off
      show_state: false
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.spalnia_hisense_vidaa_tv_turn_screen_off
      hold_action:
        action: none
    - type: button
      name: Включить экран
      icon: mdi:television
      entity: button.spalnia_hisense_vidaa_tv_turn_screen_on
      show_state: false
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.spalnia_hisense_vidaa_tv_turn_screen_on
      hold_action:
